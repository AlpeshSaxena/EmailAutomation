kind = "web"
previewPath = "/"
title = "MailFlow AI"
version = "1.0.0"
id = "artifacts/mailflow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19570

[services.development]
run = "pnpm --filter @workspace/mailflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mailflow", "run", "build" ]
publicDir = "artifacts/mailflow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19570"
BASE_PATH = "/"
